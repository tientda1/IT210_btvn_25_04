<!doctype html>
<html lang="en">
<head>
    <title th:text="#{welcome.title}">Welcome</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5" style="max-width: 560px;">
    <div class="d-flex justify-content-end mb-3">
        <a class="btn btn-outline-secondary btn-sm mr-2" th:href="@{/welcome(lang='vi')}">VI</a>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/welcome(lang='en')}">EN</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-3" th:text="#{welcome.heading}">Nhap ten chu so huu</h3>
            <p class="text-muted" th:text="#{welcome.description}">Vui long nhap ten de bat dau su dung danh sach cong viec.</p>

            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/welcome}" method="post">
                <div class="form-group">
                    <label for="ownerName" th:text="#{welcome.ownerName}">Ten chu so huu</label>
                    <input id="ownerName"
                           name="ownerName"
                           type="text"
                           class="form-control"
                           th:value="${ownerName}"
                           required>
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{welcome.start}">Bat dau</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
